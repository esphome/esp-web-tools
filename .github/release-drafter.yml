name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"

categories:
  - title: "Breaking Changes"
    semver-increment: major
    when:
      label: "breaking change"
  - title: "New Features"
    semver-increment: minor
    when:
      label: "new-feature"
  - title: "Dependencies"
    collapse-after: 1
    when:
      label: "dependencies"

header: |
  <!-- build-pending -->
  > [!WARNING]
  > Do not publish this release yet. The package is still being built and attached to this draft. This note is removed automatically once the tarball is uploaded.
  <!-- /build-pending -->

template: |
  ## What's Changed

  $CHANGES

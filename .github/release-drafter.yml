name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"

categories:
  - title: "Breaking Changes"
    semver-increment: major
    when:
      label: "breaking change"
  - title: "New Features"
    semver-increment: minor
    when:
      label: "new-feature"
  - title: "Dependencies"
    collapse-after: 1
    when:
      label: "dependencies"

template: |
  ## What's Changed

  $CHANGES
